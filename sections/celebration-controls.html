    <!-- Falling Flower Petals Canvas Layer -->
    <canvas id="petals-canvas" aria-hidden="true"></canvas>

    <!-- Confetti Celebration Canvas Layer -->
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <!-- Floating Action Controls Bar (Bottom Right, Flexbox aligned to prevent overlap) -->
    <aside class="floating-celebration-bar" aria-label="Celebration Controls">
      <button
        type="button"
        id="petals-toggle-btn"
        class="petals-toggle-btn"
        aria-label="Toggle falling flower petals"
      >
        <span>🌸</span>
        <span>Pause Petals</span>
      </button>
      <button
        type="button"
        id="confetti-btn"
        class="confetti-btn"
        aria-label="Celebrate with Confetti"
        title="Celebrate with Confetti!"
      >
        <span class="confetti-icon" aria-hidden="true">🎉</span>
        <span>Celebrate</span>
      </button>
    </aside>
