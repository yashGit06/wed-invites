      <!-- =======================================================================
         3. Live Countdown Module
         ======================================================================= -->
      <section
        class="countdown-section"
        id="countdown"
        aria-labelledby="countdown-title"
      >
        <div class="container container-narrow">
          <div class="countdown-card">
            <div class="countdown-header">
              <span class="eyebrow">Auspicious Muhurat</span>
              <h2 class="countdown-title" id="countdown-title">
                Counting Down to the Wedding Ceremony
              </h2>
              <p class="countdown-target-label" id="countdown-target-label"></p>
            </div>

            <!-- Timer Units -->
            <div
              class="countdown-timer-grid"
              id="countdown-grid"
              role="timer"
              aria-live="polite"
            >
              <div class="countdown-unit">
                <span class="countdown-number" id="count-days">--</span>
                <span class="countdown-label">Days</span>
              </div>
              <div class="countdown-separator" aria-hidden="true">:</div>
              <div class="countdown-unit">
                <span class="countdown-number" id="count-hours">--</span>
                <span class="countdown-label">Hours</span>
              </div>
              <div class="countdown-separator" aria-hidden="true">:</div>
              <div class="countdown-unit">
                <span class="countdown-number" id="count-minutes">--</span>
                <span class="countdown-label">Minutes</span>
              </div>
              <div class="countdown-separator" aria-hidden="true">:</div>
              <div class="countdown-unit">
                <span class="countdown-number" id="count-seconds">--</span>
                <span class="countdown-label">Seconds</span>
              </div>
            </div>

            <!-- Past Event Message (graceful fallback) -->
            <div
              id="countdown-past-msg"
              class="countdown-past-msg"
              style="display: none"
            ></div>

            <div class="countdown-actions">
              <a
                id="countdown-calendar-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-secondary btn-sm"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"
                  />
                </svg>
                Add Ceremony to Google Calendar
              </a>
            </div>
          </div>
        </div>
      </section>
